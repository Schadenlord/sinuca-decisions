name: Validate ADR

on:
  pull_request:
    paths:
      - "adr/[0-9]*.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar seções obrigatórias
        run: |
          FAILED=0
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep '^adr/[0-9]' || true)

          if [ -z "$CHANGED" ]; then
            echo "Nenhum ADR novo ou alterado."
            exit 0
          fi

          for file in $CHANGED; do
            if [ ! -f "$file" ]; then continue; fi
            echo "Verificando $file..."
            for section in "## Status" "## Date" "## Context" "## Decision"; do
              if ! grep -q "^${section}" "$file"; then
                echo "::error file=$file::Seção obrigatória ausente: ${section}"
                FAILED=1
              fi
            done
          done

          if [ $FAILED -eq 0 ]; then
            echo "Todos os ADRs estão válidos."
          fi
          exit $FAILED
