name: Check mapa de decisões

on:
  pull_request:
    paths:
      - "adr/[0-9]*.md"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar se mapa-de-decisoes.md foi atualizado
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          ADR_CHANGED=$(echo "$CHANGED" | grep '^adr/[0-9]' || true)
          MAPA_CHANGED=$(echo "$CHANGED" | grep '^docs/mapa-de-decisoes.md' || true)

          if [ -n "$ADR_CHANGED" ] && [ -z "$MAPA_CHANGED" ]; then
            echo "::warning::docs/mapa-de-decisoes.md não foi atualizado."
            echo "ADR(s) alterado(s):"
            echo "$ADR_CHANGED"
            echo ""
            echo "Lembre de adicionar a entrada correspondente em docs/mapa-de-decisoes.md."
          else
            echo "mapa-de-decisoes.md está atualizado."
          fi
