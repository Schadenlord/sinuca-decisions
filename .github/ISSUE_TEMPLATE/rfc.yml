name: RFC — Proposta de decisão
description: Proponha uma mudança de regra, formato ou política para discussão
title: "RFC: "
labels:
  - "type:rfc"
  - "status:proposed"
body:
  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Qual situação, dúvida ou conflito motivou esta proposta?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: O que você está propondo que seja decidido ou adotado?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivação
      description: Por que esta proposta faz sentido? Quais problemas ela resolve?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      placeholder: |
        1. Opção A — ...
        2. Opção B — ...
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impacto
      description: Afeta partidas amistosas, torneios, ranking, equipamentos?
    validations:
      required: false

  - type: checkboxes
    id: expected
    attributes:
      label: Decisão esperada
      options:
        - label: Aprovar
        - label: Rejeitar
        - label: Pedir revisão / mais informações
