name: Dúvida de regra
description: Situação específica que gerou dúvida ou conflito durante o jogo
title: "Dúvida: "
labels:
  - "type:rule-question"
  - "status:proposed"
body:
  - type: textarea
    id: situation
    attributes:
      label: Situação
      description: O que aconteceu? Descreva a jogada ou o momento que gerou a dúvida.
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Dúvida
      description: Qual é a pergunta específica sobre a regra?
    validations:
      required: true

  - type: textarea
    id: sides
    attributes:
      label: O que cada lado defende
      placeholder: |
        Jogador A defendia que...
        Jogador B defendia que...
    validations:
      required: false

  - type: textarea
    id: related_rule
    attributes:
      label: Regra que parece se aplicar
      description: Se souber, qual ADR ou regra parece ser o mais relevante?
    validations:
      required: false
